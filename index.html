<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDH2BqMNWWzrnI9QMZgBWj7gPk1gWYgAFU",
    authDomain: "klpm-a790f.firebaseapp.com",
    databaseURL: "https://klpm-a790f-default-rtdb.firebaseio.com",
    projectId: "klpm-a790f",
    storageBucket: "klpm-a790f.firebasestorage.app",
    messagingSenderId: "589472519187",
    appId: "1:589472519187:web:db488eaf2d3df699ea1be6",
    measurementId: "G-TZF7QYDFZM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, 'kp_records');

  // Cloud Save
  window.cloudSave = function() {
    set(dbRef, window.DB || [])
      .then(() => console.log("Synced to Firebase Cloud!"))
      .catch((err) => {
        console.error("Firebase sync error: ", err);
        const dot = document.getElementById("statusDot");
        if (dot) dot.style.background = "#e74c3c";
      });
  };

  // Realtime Cloud Listener
  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    const dot = document.getElementById("statusDot");

    if (data && Array.isArray(data)) {
      window.DB = data;
      localStorage.setItem(window.DBKEY, JSON.stringify(window.DB));
      if (typeof window.render === 'function') window.render(window.curTab);
      if (dot) dot.style.background = "#2ecc71";
    } else if (data === null) {
      if (window.DB && window.DB.length > 0) {
        window.cloudSave();
      }
      if (dot) dot.style.background = "#2ecc71";
    }
  }, (error) => {
    console.error("Database listener error:", error);
    const dot = document.getElementById("statusDot");
    if (dot) dot.style.background = "#e74c3c";
  });
</script>

<script>
// ── DB ────────────────────────────────────────────────────────────────────────
var DB=[], DBKEY="kp_v3";
function dbLoad(){try{var d=localStorage.getItem(DBKEY);DB=d?JSON.parse(d):[];}catch(e){DB=[];}}
function dbSave(){
  try{
    localStorage.setItem(DBKEY,JSON.stringify(DB));
    if(typeof window.cloudSave === 'function'){ window.cloudSave(); }
  }catch(e){}
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().split("T")[0];}
function nowt(){return new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});}
function fmtDate(d){if(!d)return "-";return new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}
function addDays(ds,n){var d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().split("T")[0];}
function diffDays(a,b){return Math.floor((new Date(b)-new Date(a))/86400000);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function nextFU(v){if(!v||!v.length)return null;return addDays(v[v.length-1].date,30);}
function escH(s){if(!s)return "";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function doCall(ph){window.location.href="tel:"+ph;}
function defClass(exp){
  var d=diffDays(exp,today());
  if(d<30)return null;if(d<60)return "1M Default";if(d<90)return "2M Default";return "3M+ Default";
}
function getDefaulters(){
  return DB.filter(function(n){
    if(n.status==="dead"||n.status==="migrated"||n.completed)return false;
    if(!n.visits||!n.visits.length)return false;
    var nfu=nextFU(n.visits);return nfu&&diffDays(nfu,today())>=30;
  });
}

// ── Toast ─────────────────────────────────────────────────────────────────────
var _tt;
function showToast(msg,type){
  clearTimeout(_tt);
  document.getElementById("toast").innerHTML='<div class="toast t-'+(type||"ok")+'">'+msg+'</div>';
  _tt=setTimeout(function(){document.getElementById("toast").innerHTML="";},4000);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
var curTab=0;
function goTab(i){
  var tabs=document.querySelectorAll(".tab");
  for(var j=0;j<tabs.length;j++)tabs[j].classList.toggle("on",j===i);
  for(var j=0;j<5;j++)document.getElementById("p"+j).classList.toggle("hide",j!==i);
  if(curTab===1 && i!==1){
    document.getElementById("p1").innerHTML="";
    _searchQ="";
  }
  curTab=i; render(i);
}
function render(i){
  if(i===0)renderReg();
  if(i===1)renderSearch();
  if(i===2)renderList();
  if(i===3)renderDef();
  if(i===4)renderReports();
  updBadge(); updIbar();
}
function updBadge(){var d=getDefaulters();var b=document.getElementById("dbadge");b.textContent=d.length;b.classList.toggle("hide",d.length===0);}
function updIbar(){document.getElementById("ibarTxt").textContent=DB.length+" records synced in cloud";}

// ── REGISTER ──────────────────────────────────────────────────────────────────
function renderReg(){
  document.getElementById("p0").innerHTML=
    '<div class="card" style="min-height:calc(100vh - 160px)">'+
    '<div class="ctitle">New Baby Registration</div>'+
    '<div class="fld"><label class="lbl">DEIC Number *</label>'+
      '<input class="inp" id="r_deic" placeholder="DEIC-XXXX" oninput="checkDeicDup()"/>'+
      '<div class="ibox ibox-err hide" id="deicWarn">⚠️ DEIC number already in use</div>'+
    '</div>'+
    '<div class="fld"><label class="lbl">Baby Name *</label><input class="inp" id="r_name" placeholder="Baby of / Name"/></div>'+
    '<div class="g2">'+
      '<div class="fld"><label class="lbl">Birth Weight (g)</label><input class="inp" type="number" id="r_bwt" placeholder="1200"/></div>'+
      '<div class="fld"><label class="lbl">Date of Birth</label><input class="inp" type="date" id="r_dob"/></div>'+
    '</div>'+
    '<div class="fld"><label class="lbl">Diagnosis</label><input class="inp" id="r_dx" placeholder="Preterm, LBW, HIE..."/></div>'+
    '<div class="fld"><label class="lbl">Discharge Date (Kit #1 Date) *</label>'+
      '<input class="inp" type="date" id="r_dod" onchange="renderPastKitInputs()"/>'+
    '</div>'+
    '<div class="fld"><label class="lbl">Total Kits Given So Far</label>'+
      '<select class="inp" id="r_initKits" onchange="renderPastKitInputs()">'+
        '<option value="1">1 Kit (Discharge Only)</option>'+
        '<option value="2">2 Kits</option>'+
        '<option value="3">3 Kits</option>'+
        '<option value="4">4 Kits</option>'+
        '<option value="5">5 Kits</option>'+
        '<option value="6">6 Kits</option>'+
        '<option value="7">7 Kits</option>'+
        '<option value="8">8 Kits</option>'+
        '<option value="9">9 Kits</option>'+
        '<option value="10">10 Kits</option>'+
        '<option value="11">11 Kits</option>'+
      '</select>'+
    '</div>'+
    '<div id="pastKitDatesArea" style="margin-bottom:10px;"></div>'+
    '<div class="fld"><label class="lbl">Phone Number *</label><input class="inp" type="tel" id="r_ph" placeholder="9XXXXXXXXX" maxlength="10"/></div>'+
    '<button class="btn btn-teal" onclick="doReg()">Register Baby</button>'+
    '</div>';
    
  renderPastKitInputs();
}

function checkDeicDup(){
  var inp = document.getElementById("r_deic");
  var warn = document.getElementById("deicWarn");
  if(!inp || !warn) return false;
  var val = inp.value.trim();
  if(!val){
    inp.classList.remove("inp-err");
    warn.classList.add("hide");
    return false;
  }
  var isDup = DB.some(function(item){
    return item.deic.toLowerCase() === val.toLowerCase();
  });
  if(isDup){
    inp.classList.add("inp-err");
    warn.classList.remove("hide");
    return true;
  } else {
    inp.classList.remove("inp-err");
    warn.classList.add("hide");
    return false;
  }
}

function renderPastKitInputs(){
  var count = parseInt(document.getElementById("r_initKits").value) || 1;
  var dod = document.getElementById("r_dod").value;
  var area = document.getElementById("pastKitDatesArea");
  
  if(!area) return;
  
  if(count <= 1){
    area.innerHTML = dod ? '<div class="ibox">Next Visit (Kit #2): '+fmtDate(addDays(dod, 30))+'</div>' : '';
    return;
  }
  
  var html = '<div style="background:#E0F4F4;padding:10px;border-radius:8px;border:1px solid #D0E4E4;margin-top:5px;">'+
             '<div style="font-size:11px;font-weight:700;color:#0B6E6E;margin-bottom:8px;">Select Historical Kit Dates:</div>';
             
  for(var i = 2; i <= count; i++){
    var estDate = dod ? addDays(dod, (i-1)*30) : '';
    html += '<div class="fld" style="margin-bottom:6px;">'+
              '<label class="lbl">Kit #'+i+' Date</label>'+
              '<input class="inp past-kit-date" type="date" data-kit="'+i+'" value="'+estDate+'"/>'+
            '</div>';
  }
  html += '</div>';
  area.innerHTML = html;
}

function doReg(){
  var deic=document.getElementById("r_deic").value.trim();
  var name=document.getElementById("r_name").value.trim();
  var dod=document.getElementById("r_dod").value;
  var ph=document.getElementById("r_ph").value.trim();
  
  if(checkDeicDup()){
    showToast("DEIC number already in use", "err");
    document.getElementById("r_deic").focus();
    return;
  }

  if(!deic||!name||!ph){alert("DEIC, Name and Phone are required!");return;}
  if(!dod){alert("Discharge date is required!");return;}

  var initCount = parseInt(document.getElementById("r_initKits").value) || 1;
  var visits = [];
  var usedDates = {};
  
  usedDates[dod] = true;
  visits.push({date: dod, time: "Discharge", kitNum: 1, auto: true});
  
  if(initCount > 1){
    var pastInputs = document.querySelectorAll(".past-kit-date");
    for(var k = 0; k < pastInputs.length; k++){
      var kNum = k + 2;
      var kDate = pastInputs[k].value;
      if(!kDate){
        alert("Please select the date for Kit #" + kNum);
        return;
      }
      if(usedDates[kDate]){
        showToast("More than one kit cannot be recorded on the same date ("+fmtDate(kDate)+")", "err");
        return;
      }
      usedDates[kDate] = true;
      visits.push({
        date: kDate,
        time: "Historical Entry",
        kitNum: kNum,
        auto: false
      });
    }
  }

  DB.unshift({
    id: uid(),
    deic: deic,
    name: name,
    bwt: document.getElementById("r_bwt").value||"",
    diagnosis: document.getElementById("r_dx").value||"",
    dob: document.getElementById("r_dob").value||"",
    dod: dod,
    kitDate: dod,
    phone: ph,
    visits: visits,
    status: "active",
    completed: visits.length >= 12,
    regDate: today()
  });

  dbSave();
  showToast("Baby registered with " + visits.length + " kit(s) recorded!");
  renderReg();
  updBadge();
  updIbar();
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
var _searchQ="";
function renderSearch(){
  if(!document.getElementById("searchInp")){
    document.getElementById("p1").innerHTML=
      '<div class="sw"><span class="sico">&#128269;</span>'+
      '<input class="sinp" id="searchInp" placeholder="Search DEIC / Phone / Name..." '+
      'oninput="_searchQ=this.value;doSearch(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off"/></div>'+
      '<div id="sres"></div>';
    setTimeout(function(){
      var el=document.getElementById("searchInp");
      if(el){el.focus();el.value=_searchQ;if(_searchQ)doSearch(_searchQ);}
    },50);
  }
}
function doSearch(q){
  q=q||"";
  var res=document.getElementById("sres");
  if(!res)return;
  if(q.length<1){res.innerHTML="";return;}
  var ql=q.toLowerCase();
  var found=DB.filter(function(n){
    return n.deic.toLowerCase().indexOf(ql)>-1||
           n.phone.indexOf(q)>-1||
           n.name.toLowerCase().indexOf(ql)>-1;
  });
  res.innerHTML=found.length
    ?found.map(pcHTML).join("")

function renderList(){

function renderListItems(){
  var td=today();
  var list=DB.filter(function(n){
    if(lf==="active")return n.status==="active"&&!n.completed;
    if(lf==="completed")return n.completed;
    if(lf==="due"){
      if(!n.visits||!n.visits.length||n.completed||n.status!=="active")return false;
      var nfu=nextFU(n.visits);return nfu&&diffDays(td,nfu)>=0&&diffDays(td,nfu)<=3;
    }
    if(lf==="overdue"){
      if(!n.visits||!n.visits.length||n.completed||n.status!=="active")return false;
      var nfu=nextFU(n.visits);return nfu&&diffDays(nfu,td)>0;
    }
    return true;
  });

}

function doStatus(id,status){

// ── PATIENT CARD HTML ─────────────────────────────────────────────────────────
function pcHTML(n){
  var kc=n.visits?n.visits.length:0;
  var nfu=kc>0?nextFU(n.visits):null;
  var td=today();var dl=nfu?diffDays(td,nfu):null;
  var bdg="";
  if(n.status==="dead")bdg='<span class="bdg bg-gray">Dead</span>';
  else if(n.status==="migrated")bdg='<span class="bdg bg-gray">Migrated</span>';
  else if(n.completed)bdg='<span class="bdg bg-green">Done</span>';
  else if(nfu&&diffDays(nfu,td)>0)bdg='<span class="bdg bg-red">Overdue</span>';
  else if(nfu&&dl>=0&&dl<=3)bdg='<span class="bdg bg-orange">'+(dl===0?"Today":dl+"d")+'</span>';
  else bdg='<span class="bdg bg-teal">Kit '+kc+'/12</span>';
  return '<div class="pc" onclick="openPt(\''+n.id+'\')">'+
    '<div class="prow"><div>'+
    '<div class="pname">'+escH(n.name)+'</div>'+
    '<div class="pmeta">DEIC: '+escH(n.deic)+' &bull; '+n.phone+'</div>'+
    (n.diagnosis?'<div class="pmeta">'+escH(n.diagnosis)+'</div>':'')+
    '<button class="call-btn" onclick="event.stopPropagation();doCall(\''+n.phone+'\')">&#128222; Call</button>'+
    '</div>'+bdg+'</div>'+
    '<div class="pw"><div class="pb" style="width:'+(kc/12*100)+'%"></div></div>'+
    '<div style="font-size:10px;color:#5A7070;display:flex;justify-content:space-between">'+
    '<span>'+kc+'/12 kits</span>'+(nfu&&n.status==="active"&&!n.completed?'<span>Next: '+fmtDate(nfu)+'</span>':'')+
    '</div></div>';
}

function openEdit(id){var n=DB.find(function(x){return x.id===id;});if(n)renderPt(n,true);}
function saveEdit(id){
  var n=DB.find(function(x){return x.id===id;});if(!n)return;
  var deic=document.getElementById("e_deic").value.trim();
  var name=document.getElementById("e_name").value.trim();
  var ph=document.getElementById("e_ph").value.trim();
  if(!deic||!name||!ph){alert("DEIC, Name and Phone required!");return;}

  var isDuplicate = DB.some(function(item){
    return item.id !== id && item.deic.toLowerCase() === deic.toLowerCase();
  });
  if(isDuplicate){
    showToast("Deic number already in use", "err");
    return;
  }

  var newDod=document.getElementById("e_dod").value;
  if(newDod&&newDod!==n.dod&&n.visits&&n.visits.length>0){n.visits[0].date=newDod;n.kitDate=newDod;}
  n.deic=deic;n.name=name;n.bwt=document.getElementById("e_bwt").value||"";
  n.diagnosis=document.getElementById("e_dx").value||"";
  n.dob=document.getElementById("e_dob").value||"";
  n.dod=newDod||n.dod;n.phone=ph;
  dbSave();showToast("Details updated!");openPt(id);
}

function giveKit(id){
  var n=DB.find(function(x){return x.id===id;});if(!n)return;
  var td = today();
  
  var alreadyGivenToday = (n.visits || []).some(function(v){
    return v.date === td;
  });
  if(alreadyGivenToday){
    showToast("A kit has already been given today!", "err");
    return;
  }

  var num=(n.visits?n.visits.length:0)+1;
  if(!n.visits)n.visits=[];
  n.visits.push({date:td,time:nowt(),kitNum:num});
  n.completed=n.visits.length>=12;
  dbSave();showToast("Kit #"+num+" recorded!");updBadge();updIbar();openPt(id);
}

// ── REPORTS ───────────────────────────────────────────────────────────────────
var rFrom=(function(){var d=new Date();d.setMonth(d.getMonth()-1);return d.toISOString().split("T")[0];})();
var rTo=today();
function renderReports(){
  var td=today();
  var comp=DB.filter(function(n){return n.completed;});
  var dm=DB.filter(function(n){return n.status==="dead"||n.status==="migrated";});
  var elig=DB.filter(function(n){return n.status==="active"&&!n.completed;});
  var kN=elig.reduce(function(s,n){return s+Math.max(0,12-(n.visits?n.visits.length:0));},0);
  var allV=DB.reduce(function(a,n){return a.concat((n.visits||[]).map(function(v){return {v:v,n:n};}));},[]);
  var todayV=allV.filter(function(x){return x.v.date===td;});
  var todayNew=todayV.filter(function(x){return x.v.kitNum===1;});
  var todayFU=todayV.filter(function(x){return x.v.kitNum>1;});
  var rangeV=allV.filter(function(x){return x.v.date>=rFrom&&x.v.date<=rTo;});
  var byM={};allV.forEach(function(x){var k=x.v.date.slice(0,7);byM[k]=(byM[k]||0)+1;});
  var months=Object.keys(byM).sort();
  var maxC=months.length?Math.max.apply(null,months.map(function(m){return byM[m]||0;})):1;
  if(maxC===0)maxC=1;
  function sc(num,lbl,color,fn){return '<div class="sc" onclick="showRptList(\''+fn+'\')"><div class="snum" style="color:'+color+'">'+num+'</div><div class="slbl">'+lbl+'</div><div class="slink">View List</div></div>';}
  var html='<div class="sg">'+
    sc(DB.length,"Total Registered","#0B6E6E","all")+
    sc(comp.length,"Completed 12 Kits","#1A7A4A","comp")+
    sc(dm.length,"Dead / Migrated","#7B5EA7","dm")+
    sc(kN,"Kits Needed (Eligible)","#C0392B","needed")+
    '</div>';
  html+='<div class="card"><div class="ctitle">Kits Given Today ('+fmtDate(td)+')</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
    '<div class="sc" onclick="showRptList(\'tnew\')"><div class="snum" style="color:#0B6E6E">'+todayNew.length+'</div><div class="slbl">New Kit (#1)</div><div class="slink">View List</div></div>'+
    '<div class="sc" onclick="showRptList(\'tfu\')"><div class="snum" style="color:#E8820C">'+todayFU.length+'</div><div class="slbl">Follow-up Kits</div><div class="slink">View List</div></div>'+
    '</div>'+
    '<div style="background:#E0F4F4;border-radius:7px;padding:8px;text-align:center;cursor:pointer" onclick="showRptList(\'tall\')">'+
    '<span style="font-size:16px;font-weight:700;color:#0B6E6E">'+todayV.length+' Total Today &rsaquo;</span></div></div>';
  html+='<div class="card"><div class="ctitle">By Date Range</div>'+
    '<div class="g2" style="margin-bottom:8px">'+
    '<div class="fld"><label class="lbl">From</label><input class="inp" type="date" value="'+rFrom+'" onchange="rFrom=this.value;renderReports()"/></div>'+
    '<div class="fld"><label class="lbl">To</label><input class="inp" type="date" value="'+rTo+'" onchange="rTo=this.value;renderReports()"/></div>'+
    '</div><div style="background:#E0F4F4;border-radius:7px;padding:8px;text-align:center;cursor:pointer" onclick="showRptList(\'range\')">'+
    '<div style="font-size:22px;font-weight:700;color:#0B6E6E">'+rangeV.length+'</div>'+
    '<div style="font-size:11px;color:#5A7070">Kits in this period &bull; View List</div></div></div>';
  html+='<div class="card"><div class="ctitle">Monthly Summary</div>';
  if(!months.length){html+='<div style="color:#5A7070;font-size:12px">No data</div>';}
  else{months.forEach(function(m){var c=byM[m];var ml=new Date(m+"-01").toLocaleDateString("en-IN",{month:"short",year:"numeric"});
    html+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="font-weight:600">'+ml+'</span><span style="color:#0B6E6E;font-weight:700">'+c+' kits</span></div>'+
    '<div class="pw"><div class="pb" style="width:'+(c/maxC*100)+'%"></div></div></div>';});}
  html+='</div>';
  document.getElementById("p4").innerHTML=html;
}

    '<button class="btn btn-orange btn-sm" style="flex:1" onclick="doCSV(\''+escH(title)+'\')">Excel / CSV</button>'+
    '</div>';
  html+=tbl;
  html+='<div style="margin-top:10px"><button class="btn btn-out" onclick="closeModal()">Close</button></div>';
  html+='</div></div>';
  var m=document.getElementById("modal");m.innerHTML=html;m.classList.remove("hide");
}
function closeModal(){document.getElementById("modal").innerHTML="";document.getElementById("modal").classList.add("hide");}

// ── CSV ───────────────────────────────────────────────────────────────────────
function doCSV(title){
  var tbl=document.getElementById("rptTable");if(!tbl){alert("No data");return;}
  var rows=Array.from(tbl.querySelectorAll("tr"));
  var csv=rows.map(function(r){return Array.from(r.querySelectorAll("th,td")).map(function(c){return'"'+c.innerText.replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="KP_"+title.replace(/[^a-zA-Z0-9]/g,"_")+"_"+today()+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
var _adminFound=[];
function openAdmin(){
  var html='<div class="ovl" onclick="closeModal()"><div class="mdl" onclick="event.stopPropagation()" style="max-height:90vh;overflow-y:auto">';
  html+='<div class="mhdl"></div>';
  html+='<div style="display:flex;justify-content:space-between;margin-bottom:14px"><div style="font-size:15px;font-weight:700">Admin Settings</div><button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#5A7070">&times;</button></div>';
  html+='<div style="background:#E0F4F4;border-radius:9px;padding:12px;text-align:center;margin-bottom:12px"><div style="font-size:24px;font-weight:700;color:#0B6E6E">'+DB.length+'</div><div style="font-size:11px;color:#5A7070">Babies registered</div></div>';
  html+='<div style="background:#FEF9E7;border:1.5px solid #D4A017;border-radius:9px;padding:12px;margin-bottom:12px">'+
    '<div style="font-size:13px;font-weight:700;color:#D4A017;margin-bottom:8px">Delete Specific Entry</div>'+
    '<input class="inp" id="adminSrch" placeholder="Search DEIC / Phone / Name / Reg Date" oninput="adminSearch(this.value)" style="margin-bottom:8px"/>'+
    '<div id="adminSearchRes"></div></div>';
  html+='<div style="background:#FDECEA;border:1.5px solid #C0392B;border-radius:9px;padding:12px;margin-bottom:12px">'+
    '<div style="font-size:13px;font-weight:700;color:#C0392B;margin-bottom:6px">Delete All Data</div>'+
    '<div style="font-size:12px;color:#5A7070;margin-bottom:10px">Permanently deletes all records. Cannot be undone.</div>'+
    '<button class="btn btn-red" onclick="adminStep2()">Delete All Data</button></div>';
  html+='<button class="btn btn-out" onclick="closeModal()">Close</button>';
  html+='</div></div>';
  var m=document.getElementById("modal");m.innerHTML=html;m.classList.remove("hide");
}
function adminSearch(q){
  var res=document.getElementById("adminSearchRes");
  if(!q||q.length<2){res.innerHTML="";_adminFound=[];return;}
  var ql=q.toLowerCase();
  _adminFound=DB.filter(function(n){return n.deic.toLowerCase().indexOf(ql)>-1||n.phone.indexOf(q)>-1||n.name.toLowerCase().indexOf(ql)>-1||(n.regDate&&n.regDate.indexOf(q)>-1);});
  if(!_adminFound.length){res.innerHTML='<div style="font-size:12px;color:#5A7070;padding:6px 0">No records found</div>';return;}
  res.innerHTML=_adminFound.map(function(n,i){
    var kc=n.visits?n.visits.length:0;
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee">'+
      '<div><div style="font-size:12px;font-weight:700">'+escH(n.name)+'</div>'+
      '<div style="font-size:10px;color:#5A7070">DEIC: '+escH(n.deic)+' | Kits: '+kc+'/12 | Reg: '+fmtDate(n.regDate)+'</div></div>'+
      '<button class="del-entry-btn" onclick="adminDelEntry('+i+')">Delete</button></div>';
  }).join("");
}
function adminDelEntry(idx){
  var n=_adminFound[idx];if(!n)return;
  if(!window.confirm("Delete entry for "+n.name+"?\nThis cannot be undone."))return;
  var pwd=window.prompt("Enter admin password:");
  if(pwd!=="123456"){alert("Wrong password!");return;}
  DB=DB.filter(function(x){return x.id!==n.id;});
  dbSave();updBadge();updIbar();showToast("Entry for "+n.name+" deleted.");
  var q=document.getElementById("adminSrch");if(q)adminSearch(q.value);
}
function adminStep2(){
  var html='<div class="ovl" onclick="closeModal()"><div class="mdl" onclick="event.stopPropagation()"><div class="mhdl"></div>'+
    '<div style="text-align:center;padding:10px 0 18px"><div style="font-size:44px">&#9888;</div>'+
    '<div style="font-size:15px;font-weight:700;color:#C0392B;margin:8px 0">Confirm Delete All</div>'+
    '<div style="font-size:12px;color:#5A7070">All '+DB.length+' records will be deleted permanently.</div></div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-out" style="flex:1" onclick="openAdmin()">Cancel</button>'+
    '<button class="btn btn-red" style="flex:1" onclick="adminStep3()">Yes, Continue</button></div></div></div>';
  var m=document.getElementById("modal");m.innerHTML=html;m.classList.remove("hide");
}
function adminStep3(){
  var html='<div class="ovl" onclick="closeModal()"><div class="mdl" onclick="event.stopPropagation()"><div class="mhdl"></div>'+
    '<div style="text-align:center;margin-bottom:16px"><div style="font-size:32px">&#128272;</div>'+
    '<div style="font-size:14px;font-weight:700;margin:8px 0">Enter Admin Password</div>'+
    '<div style="font-size:11px;color:#5A7070">Enter password to confirm deletion</div></div>'+
    '<div class="fld"><input class="inp" type="password" id="apwd" placeholder="Password" maxlength="10" style="text-align:center;font-size:18px;letter-spacing:5px"/>'+
    '<div id="aperr" style="color:#C0392B;font-size:11px;text-align:center;margin-top:4px"></div></div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-out" style="flex:1" onclick="openAdmin()">Cancel</button>'+
    '<button class="btn btn-red" style="flex:1" onclick="doClean()">Delete All</button></div></div></div>';
  var m=document.getElementById("modal");m.innerHTML=html;m.classList.remove("hide");
}
function doClean(){
  var p=document.getElementById("apwd").value;
  if(p!=="123456"){document.getElementById("aperr").textContent="Wrong password!";return;}
  DB=[];dbSave();closeModal();render(curTab);showToast("All data deleted.");
}

dbLoad();renderReg();updBadge();updIbar();
</script>
